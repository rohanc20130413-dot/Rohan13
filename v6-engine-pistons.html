main{position:relative;z-index:2;pointer-events:none}
section{height:100vh}
.hero{display:flex;justify-content:center;padding-top:14vh}
h1{font-size:clamp(100px,26vw,330px);font-weight:900;letter-spacing:-.07em;line-height:.85;display:flex;opacity:.92}

.nogl #gl{display:none}
</style>
</head>

      c.pbody.scale.setScalar(Math.max(.001,1-K.m));c.shape.scale.setScalar(Math.max(.001,K.m));c.shape.rotation.set(theta*.7,theta*.5,0);
      var f=Math.pow(Math.max(0,Math.cos(rho-c.psi)),12)*spin*(c.rem&&rem>.12?0:1);
      c.headMat.emissiveIntensity=f*1.4;c.sleeveMat.emissiveIntensity=f*.8;c.glowM.opacity=f*.75;
      if(c.rem){
        var o=1-clamp((rem-.55)/.4,0,1);
        c.pmats.forEach(function(m){m.opacity=o});
        var vis=rem<.995;c.piston.visible=c.rod.visible=c.smE.visible=c.bigE.visible=vis;
      }
    }
    var asp=cam.aspect,dist=K.d*1.28*(asp<1?1+(1-asp)*.95:1),vib=Math.min(1,omega/18)*.012;
    eng.position.set(Math.sin(now*.09)*vib,Math.cos(now*.11)*vib,0);
    eng.rotation.y=K.yaw;eng.rotation.x=.12;
    cam.position.set(0,K.y*1.1,dist);cam.lookAt(0,1.6,0);
    renderer.render(scene,cam);

    var k=clamp(Math.round(cur*4),0,4);
    if(k!==active){active=k;links.forEach(function(a,i){a.classList.toggle('on',i===k)})}
    if(pg)pg.seek(1000*cur);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
